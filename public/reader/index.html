        .comic-page { max-width: 100%; max-height: 100vh; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,1); }

        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20,20,20,0.7); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 60px; height: 60px; font-size: 24px; cursor: pointer; z-index: 110; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); transition: all 0.2s; }
        .nav-btn:hover { background: white; color: black; transform: translateY(-50%) scale(1.1); }
        #btn-prev { left: 30px; }
        #btn-next { right: 30px; }
        @media (max-width: 768px) { .nav-btn { display: none; } }
        #progress { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 20px; font-size: 14px; letter-spacing: 2px; z-index: 110; pointer-events: none; border: 1px solid #333; }

        .site-link:hover { color: #000; background: #fff; border-color: #fff; }

    <div id="hit-right" onclick="nextPage()"></div>
    <button id="btn-prev" class="nav-btn" onclick="prevPage()">&#10094;</button>
    <button id="btn-next" class="nav-btn" onclick="nextPage()">&#10095;</button>
    <div id="progress">PAGE <span id="curr">Cover</span> / 50</div>

    <script>
        let currentIdx = 0;
        const pages = document.querySelectorAll('.page-wrapper');
        const currEl = document.getElementById('curr');
        
        function updatePages() {
            pages.forEach((page, idx) => {
                page.classList.remove('active', 'previous');
                if (idx === currentIdx) { page.classList.add('active'); } 
                else if (idx < currentIdx) { page.classList.add('previous'); }
            });
            currEl.innerText = currentIdx === 0 ? "Cover" : currentIdx;
            
            document.getElementById('btn-prev').style.opacity = currentIdx === 0 ? '0' : '1';
            document.getElementById('btn-next').style.opacity = currentIdx === pages.length - 1 ? '0' : '1';
            document.getElementById('btn-prev').style.pointerEvents = currentIdx === 0 ? 'none' : 'auto';
            document.getElementById('btn-next').style.pointerEvents = currentIdx === pages.length - 1 ? 'none' : 'auto';
            
            // On mobile, scroll to top of the new page automatically when turning pages
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        function nextPage() { if (currentIdx < pages.length - 1) { currentIdx++; updatePages(); } }
        function prevPage() { if (currentIdx > 0) { currentIdx--; updatePages(); } }
        
        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') { nextPage(); }
            if (e.key === 'ArrowLeft') { prevPage(); }
        });
        
        // Mobile Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;
        let touchStartY = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;
            
            // Require a minimum horizontal distance, and ensure it was mostly a horizontal swipe (not scrolling down)
            if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    // Swiped Left -> Next Page
                    nextPage();
                } else {
                    // Swiped Right -> Previous Page
                    prevPage();
                }
            }
        }

        updatePages();
    </script>
